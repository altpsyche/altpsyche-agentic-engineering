name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs scripts/verify.sh: the agent-layer check (plain Node, no packages, no install) plus whatever
  # project checks Phase 0 adds to it. Update AGENTS.md § Verifying your work in the same commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/verify.sh
